
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - 李晓阳的技术博客</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
    <style>
        .search-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #2196F3;
            border-radius: 25px;
            outline: none;
            margin-bottom: 20px;
        }
        .search-results {
            margin-top: 20px;
        }
        .search-result-item {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .search-result-item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }
        .search-result-title {
            color: #2196F3;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .search-result-excerpt {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .search-result-meta {
            color: #999;
            font-size: 14px;
        }
        .no-results {
            text-align: center;
            color: #999;
            font-size: 18px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <div class="search-container">
        <h1 style="text-align: center; color: #2196F3; margin-bottom: 30px;">
            <i class="fas fa-search"></i> 搜索文章
        </h1>
        <input type="text" id="searchInput" class="search-box" placeholder="输入关键词搜索文章...">
        <div id="searchResults" class="search-results"></div>
    </div>

    <script>
        // 搜索功能：对正文做「去 HTML + 去 URL」后再匹配，避免短词误命中标签/链接（如 "tt" 命中 https）
        let searchData = [];

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return (tmp.textContent || tmp.innerText || '').trim();
        }

        function normalizeForSearch(raw) {
            let t = stripHtml(raw);
            t = t.replace(/https?:\/\/\S+/gi, ' ');
            t = t.replace(/\s+/g, ' ').trim();
            return t;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function matchQuery(item, keywords) {
            const titleLower = item.title.toLowerCase();
            const bodyLower = item.plainBody.toLowerCase();
            return keywords.every(kw =>
                titleLower.includes(kw) || bodyLower.includes(kw)
            );
        }

        function performSearch(query) {
            const q = query.trim();
            if (!q) {
                document.getElementById('searchResults').innerHTML = '';
                return;
            }
            if (!searchData.length) {
                document.getElementById('searchResults').innerHTML =
                    '<div class="no-results">正在加载文章索引，请稍候再试…</div>';
                return;
            }

            const keywords = q.toLowerCase().split(/\s+/).filter(Boolean);
            const results = searchData.filter(item => matchQuery(item, keywords));
            displayResults(results);
        }

        function displayResults(results) {
            const resultsContainer = document.getElementById('searchResults');

            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results">没有找到相关文章</div>';
                return;
            }

            let html = '';
            results.forEach(result => {
                const excerpt = result.excerptPreview.length > 220
                    ? result.excerptPreview.slice(0, 220) + '…'
                    : result.excerptPreview;
                html += `
                    <div class="search-result-item">
                        <div class="search-result-title">
                            <a href="${escapeHtml(result.link)}" style="color: #2196F3; text-decoration: none;">
                                ${escapeHtml(result.title)}
                            </a>
                        </div>
                        <div class="search-result-excerpt">${escapeHtml(excerpt)}</div>
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        const searchInputEl = document.getElementById('searchInput');

        fetch('/search.xml')
            .then(response => response.text())
            .then(data => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data, 'text/xml');
                const entries = xmlDoc.getElementsByTagName('entry');

                for (let i = 0; i < entries.length; i++) {
                    const entry = entries[i];
                    const titleEl = entry.getElementsByTagName('title')[0];
                    const linkEl = entry.getElementsByTagName('link')[0];
                    const urlEl = entry.getElementsByTagName('url')[0];
                    const contentEl = entry.getElementsByTagName('content')[0];

                    const title = titleEl ? titleEl.textContent.trim() : '';
                    const rawHtml = contentEl ? contentEl.textContent : '';
                    const plainBody = normalizeForSearch(rawHtml);
                    const excerptPreview = plainBody || stripHtml(rawHtml);

                    searchData.push({
                        title,
                        link: (linkEl && linkEl.getAttribute('href')) || (urlEl ? urlEl.textContent.trim() : ''),
                        plainBody,
                        excerptPreview
                    });
                }

                performSearch(searchInputEl.value);
            })
            .catch(error => {
                console.error('加载搜索数据失败:', error);
                document.getElementById('searchResults').innerHTML =
                    '<div class="no-results">加载搜索数据失败，请刷新页面重试</div>';
            });

        searchInputEl.addEventListener('input', function (e) {
            performSearch(e.target.value);
        });

        document.addEventListener('DOMContentLoaded', function () {
            searchInputEl.focus();
        });
    </script>
</body>
</html>
